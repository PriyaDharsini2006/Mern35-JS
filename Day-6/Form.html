<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="2xl:container mx-auto">
        <div class="w-[90%] mx-auto flex justify-center items-center h-screen">
           <div class="flex flex-col gap-5 items-center border p-5 rounded-lg">
                <h1>LOGIN</h1>
                <form id="form" novalidate>
                <div class="flex flex-col gap-2">
                        <label>Email:</label>
                        <input type="email" name="email" required id="email" class="border border-black rounded-md p-2">
                        <p id="EmailError" class="text-red-500 text-sm"></p>
                    </div>
                <div class="flex flex-col gap-2">
                        <label>Password:</label>
                        <input type="password" name="password" required  id="password" class="border border-black rounded-md p-2">
                        <p id="PasswordError" class="text-red-500 text-sm"></p>
                </div>
                <div class="gap-2">
                    <button id="button" class="mt-4 p-2 rounded-lg bg-green-600 hover:bg-green-700 w-full text-white transition-all">Login</button>
                </div>
                </form>
           </div>
        </div>
    </div>
    <script>
        const form=document.getElementById('form');
        const email= document.getElementById('email');
        const password= document.getElementById('password');
        const button= document.getElementById('button');
        const emailError=document.getElementById('EmailError');
        const passwordError=document.getElementById('PasswordError');
        
        form.addEventListener("submit",(e)=>{
            e.preventDefault();
            advanced(email.value,password.value);
        })

        email.addEventListener("input",(e)=>{
            var emailRegex = /^\S+@\S+\.\S+$/;
            if(emailRegex.test(e.target.value)){
                emailError.textContent="";
            }
            else if(e.target.value===""){
                emailError.textContent="Email is required";
            }
            else{
                emailError.textContent="Please enter a valid email address.";
            }
        })

        password.addEventListener("input",(e)=>{
            var passwordRegex=/^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9])(?=.*?[#?!@$%^&*-]).{8,}$/;
            if(passwordRegex.test(e.target.value)){
                passwordError.textContent="";
            }
            else if(e.target.value===""){
                passwordError.textContent="Password is required";
            }
            else{
                passwordError.textContent="Invalid Password";
            }
        })


        var advanced=(email,password)=>{
            var emailRegex = /^\S+@\S+\.\S+$/;
            var passwordRegex=/^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9])(?=.*?[#?!@$%^&*-]).{8,}$/;
            if(!emailRegex.test(email)){
                emailError.textContent="Please enter a valid email address.";
            }
            if(!passwordRegex.test(password)){
                passwordError.textContent="Invalid Password";
            }
            if(emailRegex.test(email) && passwordRegex.test(password)){
                emailError.textContent="";
                passwordError.textContent="";
                alert("Login successful!");
                form.reset();
            }
        }
        
    </script>
</body>
</html>
