<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="2xl:container mx-auto">
        <div class="w-[90%] mx-auto grid grid-cols-1 md:grid-cols-2">
            <div class="bg-red-500 flex justify-between">
                <h1>Logo</h1>


                <div>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-menu preview-icon md:hidden" id="menu"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 8h10"/><path d="M7 12h10"/><path d="M7 16h10"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x preview-icon hidden md:hidden" id="cross"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            
                </div>
                </div>
            <div id="list"class="bg-green-600 hidden md:block">
                <ul class="flex gap-4 justify-end flex-col md:flex-row">
                    <li><a href="">Home</a></li>
                    <li><a href="">About</a></li>
                    <li><a href="">Services</a></li>
                    <li><a href="">Contact</a></li>
                </ul>
            </div>


        </div>

    </div>


    <script>
        var menu=document.getElementById("menu");
        var cross=document.getElementById("cross");
        var list=document.getElementById("list");


        menu.addEventListener("click",()=>{
            list.classList.remove("hidden")
            cross.classList.remove("hidden")
            menu.classList.add("hidden")
        })


        cross.addEventListener("click",()=>{
            list.classList.add("hidden")
            cross.classList.add("hidden")
            menu.classList.remove("hidden")
        })
    </script>
    
</body>
</html>
