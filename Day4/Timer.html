<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="2xl:container mx-auto">
        <div class="w-[90%] mx-auto flex justify-center items-center h-screen">
            <div class="flex flex-col items-center justify-center gap-5">
                <h1 id="par">0</h1>
                <div class="flex gap-4">
                    <button id="start" class="bg-blue-500 text-white px-4 py-2 rounded">start</button>
                    <button id="stop" class="bg-red-500 text-white px-4 py-2 rounded">stop</button>
                    <button id="timer" class="bg-green-500 text-white px-4 py-2 rounded">timer</button>
                </div>
            </div>
        </div>
    </div>

    </div>

    <script>
        var par=document.getElementById("par");
        var start=document.getElementById("start");
        var stop=document.getElementById("stop");
        var timer=document.getElementById("timer");

        console.dir(par);

        start.addEventListener("click",()=>{
            SI=setInterval(()=>{
                par.textContent=parseInt(par.textContent)+1
            },[1000])
        })

        stop.addEventListener("click",()=>{
            clearInterval(SI)
        })


        timer.addEventListener("click",()=>{
            setTimeout(()=>{
                alert("timer is done")
                clearInterval(SI)
            },[5000])
        })


    </script>

</body>
</html>
