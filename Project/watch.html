<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="2xl:container mx-auto">
        <div class="w-[90%] mx-auto flex justify-center items-center h-screen">
            <div class="flex flex-col items-center justify-center gap-4">
                <h1 id="par">0</h1>
                <div class="flex gap-4">
                    <button id="start" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">start</button>
                    <button id="stop" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">stop</button>
                    <button id="timer" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Timer</button>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        var par = document.getElementById("par");
        var start = document.getElementById("start");
        var st = document.getElementById("stop");
        var timer = document.getElementById("timer");
       
        start.addEventListener("click",()=>{
            sI=setInterval(()=>{
                par.textContent=parseInt(par.textContent)+1;
            },[1000])
        })
        
        st.addEventListener("click",()=>{
            clearInterval(sI);
        })


        timer.addEventListener("click",()=>{
            setTimeout(()=>{
                alert("Time is up");
                clearInterval(sI);
            },[5000]            
        )
        })
    </script>
</body>
</html>
