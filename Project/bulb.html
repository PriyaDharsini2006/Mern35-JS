
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulb and Cat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-200">

    <div class="flex  bg-black items-center justify-center min-h-screen">

        <div class="p-10 rounded-2xl flex flex-col items-center">

            <!-- ON Images -->
            <img id="bulbon"
            src="https://ik.imagekit.io/4z8covdo9/Full%20stack/bulb-go-on-img.png"
            class="w-40 h-40 object-contain">

            <img id="caton"
            src="https://ik.imagekit.io/4z8covdo9/Full%20stack/cat-img.png"
            class="w-48 h-48 object-contain">

            <!-- OFF Images -->
            <img id="bulboff"
            src="https://ik.imagekit.io/4z8covdo9/Full%20stack/bulb-go-off-img.png"
            class="w-40 h-40 object-contain hidden">

            <img id="catoff"
            src="https://ik.imagekit.io/4z8covdo9/Full%20stack/cat-eyes-img.png"
            class="w-48 h-48 object-contain hidden">

            <!-- Buttons -->
            <div class="flex gap-5 mt-6">

                <button id="on"
                class="bg-green-500 text-white px-10 py-3 rounded-lg font-bold hover:bg-green-600">
                    ON
                </button>

                <button id="off"
                class="bg-red-500 text-white px-10 py-3 rounded-lg font-bold hover:bg-red-600">
                    OFF
                </button>

            </div>

        </div>

    </div>

    <script>

        // GETTER

        let bulbon = document.getElementById("bulbon");
        let caton = document.getElementById("caton");
        let bulboff = document.getElementById("bulboff");
        let catoff = document.getElementById("catoff");

        let on = document.getElementById("on");
        let off = document.getElementById("off");


        // ON BUTTON

        on.addEventListener("click", () => {

            bulbon.style.display = "block";
            caton.style.display = "block";

            bulboff.style.display = "none";
            catoff.style.display = "none";

        });


        // OFF BUTTON

        off.addEventListener("click", () => {

            bulbon.style.display = "none";
            caton.style.display = "none";

            bulboff.style.display = "block";
            catoff.style.display = "block";

        });

    </script>

</body>
</html>
